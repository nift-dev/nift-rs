name: ci

on:
  push:
  pull_request:

jobs:
  check:
    name: ${{ matrix.id }} (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux
            runner: ubuntu-latest
          - id: macos
            runner: macos-latest
          - id: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --check
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Verify canonical corpus mirror integrity
        shell: bash
        run: bash corpus/sync_corpus.sh verify
      - name: Forbid unsafe (belt-and-braces)
        shell: bash
        run: |
          grep -q 'forbid(unsafe_code)' crates/nift/src/lib.rs || { echo 'missing #![forbid(unsafe_code)]' >&2; exit 1; }
          grep -q 'unsafe_code = "forbid"' Cargo.toml || { echo 'missing workspace forbid lint' >&2; exit 1; }

  # The declared MSRV (rust-version = "1.97") must actually compile; stable is
  # the main lint/test toolchain.
  msrv:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux
            runner: ubuntu-latest
          - id: macos
            runner: macos-latest
          - id: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97
      - name: Build all targets at MSRV
        run: cargo check --workspace --all-targets
