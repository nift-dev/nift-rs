[package]
name = "jsonic"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native Rust JSON implementation (Jsonic++ contract): parser, ordered Value, schema validation"

[dependencies]
# Insertion-ordered object map (the frozen reference stores JSON objects as an
# ordered document; member order = insertion/document order).
indexmap = "2"
# JSON Schema `pattern` keyword (RE2-style syntax; portable agreement with the reference).
regex = "1"
