[package]
name = "nift"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Independent Rust implementation of the Nift template language and project-aware rendering engine."
keywords = ["nift", "templating", "ssr", "static-site"]
categories = ["template-engine"]

[lints]
workspace = true

[dependencies]
# Insertion-ordered object map: the frozen reference stores JSON objects as an
# ordered document (member order = insertion/document order), which affects
# template rendering when objects are iterated.
indexmap = "2"
# JSON Schema `pattern` keyword (portable agreement with the reference's
# std::regex_search for the supported corpus; RE2-style syntax).
regex = "1"
# Time/platform-dependent built-in metadata (build-time/date/YYYY/YY/timezone).
# Only these explicitly time-dependent built-ins use a clock; deterministic
# metadata and rendering never depend on the current time.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
